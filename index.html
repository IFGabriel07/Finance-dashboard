<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="js/app.js" defer></script>
    <link rel="stylesheet" href="css\style.css">
</head>

<body>
    <div>

        <nav>

            <button type="button">Dashboard</button>
            <button type="button">Transações</button>
            <button type="button">Relatórios</button>
            <button type="button">investimentos</button>

        </nav>

        <header>

            <h1>Meu Financeiro</h1>

        </header>

        <section>

            <div>

                <h2>Saldo Atual</h2>
                <p id="saldo">R$ 0,00</p>

                <h2>Entradas</h2>
                <p id="entradas">R$ 0,00</p>

                <h2>Saídas</h2>
                <p id="saidas">R$ 0,00</p>

            </div>

        </section>

        <section>

            <form>
                <h2> Nova Transação </h2>

                <label for="descricao">descrição:</label>
                <input type="text" id="descricao" name="descricao" required>

                <label for="valor">valor:</label>
                <input type="number" step="0.01" id="valor" name="valor" required>



                <label for="tipo">tipo:</label>
                <select name="tipo" id="tipo">
                    <option value="entradas">Entrada</option>
                    <option value="saidas">Saída</option>
                </select>


                <button type="submit">Adicionar</button>
            </form>

        </section>

    </div>
</body>

</html>
